<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jigsaw Puzzle Solver</title>
</head>
<body>

    <h1>Jigsaw Puzzle Solver</h1>

    <p>Select your puzzle's reference image:</p>

    <input type="file" id="imageInput" accept="image/*">

    <h2>Reference Image</h2>

    <img id="preview" width="400" alt="Selected puzzle image">

    <script>
        const imageInput = document.querySelector("#imageInput");
        const preview = document.querySelector("#preview");

        imageInput.addEventListener("change", function(event) {
            const file = event.target.files[0];

            if (!file) return;

            const imageURL = URL.createObjectURL(file);

            preview.onload = function() {
                console.log("Image loaded successfully!");

                console.log("Original width:", preview.naturalWidth);
                console.log("Original height:", preview.naturalHeight);

                URL.revokeObjectURL(imageURL);
            };
            
            preview.src = imageURL;
        });
    </script>

</body>
</html>
